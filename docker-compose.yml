version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: ruta8_backend
    volumes:
      # Montar para persistir la base de datos sqlite en el host y habilitar recarga en caliente si es necesario
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - N8N_WEBHOOK_URL=https://webhook.site/placeholder-n8n-webhook
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: ruta8_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
